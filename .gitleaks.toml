# EngMentor 密钥扫描配置（本机 `pnpm check:secrets` 与 CI 的 secrets job 共用）。
#
# SPEC-M00 §8 要求"例外条目必须写明理由"：命中的是哪条规则、为什么它是误报、
# 为什么不能用更精确的规则代替。下面是本文件**唯一**一条例外，按这三条写清。
#
# 严禁在本文件里写入任何真实密钥形态的字符串——那等于把泄漏复制一份到配置里。
# 严禁把本文件用作"让扫描通过"的手段：先确认真的是误报，再放行。

title = "EngMentor gitleaks 配置"

[extend]
# 启用 gitleaks 内置规则集。这里固定的是 **gitleaks 版本**（见
# scripts/check-secrets.mjs 的 PINNED_GITLEAKS_VERSION 与 .github/workflows/ci.yml
# 的 GITLEAKS_VERSION，两者由脚本断言一致），而不是把规则快照复制进本文件——
# 复制规则会让上游的规则改进永远无法到达本仓库。
useDefault = true

# ---------------------------------------------------------------------------
# 例外 1（2026-09-19 加入）—— 已知的测试哨兵值，历史上曾以"密钥形态"存在
# ---------------------------------------------------------------------------
#
# 命中的规则：`generic-api-key`。
#
# 命中内容：提交 55ff124 里 3 处**测试常量**，形如 `sk-live-SECRET-<hex>`。
# 它们是为了断言"密钥不得出现在日志、响应或错误信息里"而写的哨兵值，
# 从未是任何服务的真实凭据，也从未被任何代码读取过。
#
# 为什么是误报：`generic-api-key` 只看"关键字 + 高熵字符串"的形态，
# 而当时那三个常量恰好写成了密钥的形态。它们不是泄漏，但形态与真凭据无法区分。
#
# 为什么不能用更精确的规则代替：正因为形态相同，**任何基于内容的规则都无法区分**
# 二者；能更精确的只有"范围"——于是这里把范围缩到"某一个提交 + 那几条路径"。
#
# 为什么不是改写历史：本仓库禁止 force push（AGENTS.md），
# 而 55ff124 已推送到 origin，剔除它必须改写历史，因此不做。
#
# 范围有多窄（已实测，不是推断）：
#   * 加本例外之前：全量历史 3 处命中；加之后：0 处；
#   * 在另一个提交里、向同一条路径写入同样形态的字符串 → **仍会被检出**
#     （`condition = "AND"` 里的 commits 不匹配，例外整条不生效）。
#     也就是说本例外只放宽"那一个已经推出去的提交"，不放宽任何未来的提交。
#
# 移除条件（满足任一条即应删除本例外并重跑扫描）：
#   1. 该分支被 squash 合并进 main（55ff124 不再出现在 main 的历史里）；
#   2. 用户授权对已推送分支做历史改写，把那三个常量从历史中清除；
#   3. 该提交因任何原因不再位于仓库历史中。
#
# 同时已经做的事（这条例外只是补历史，不是替代修复）：工作区里那三个常量
# 已全部改成不含密钥形态的哨兵值 `engm-test-sentinel-*`，并在各测试文件顶部
# 写明了"不要把它写回密钥形态"的原因。
[[allowlists]]
description = "测试哨兵值 sk-live-SECRET-* 只放宽提交 55ff124 的 3 处历史命中；不放宽任何未来提交"
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["55ff124623bcbbcd6496e7fc4fc2eb764e8dff76"]
paths = [
  '''services/ai-core/tests/test_sidecar\.py''',
  '''services/ai-core/tests/test_sidecar_http\.py''',
  '''apps/desktop/src-tauri/src/secrets\.rs''',
]
