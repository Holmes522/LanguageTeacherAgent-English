[project]
name = "engm-contracts"
version = "0.0.0"
description = "EngMentor 本地契约（Python 侧，schema 生成物）。不发布到任何索引，由 services/ai-core 以 path 依赖消费。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engm_contracts"]

[tool.uv]
# SPEC-M00 §6.1：这里是一个正常的可安装包，靠 uv 装进虚拟环境，
# 而不是靠 PYTHONPATH / sys.path.append / conftest.py 路径注入。
#
# 本包刻意不声明 [dependency-groups].dev：契约的三方一致性测试运行在 services/ai-core 的
# 虚拟环境里（那里能看到本包，也安装了 jsonschema），再开一个 uv 项目会多出一个 lockfile，
# 与「每个安装边界只有一个权威 lockfile」冲突。
package = true
